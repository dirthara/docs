services:
  docusaurus:
    build:
      context: .
      dockerfile: Docker/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-24-bookworm-slim}
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    working_dir: /app
    init: true
    # The container stays up and commands run inside it with `docker compose
    # exec`, the way the package repositories drive their php service.
    command: ["sleep", "infinity"]
    ports:
      - "${DOCS_PORT:-3000}:3000"
    volumes:
      - .:/app
      # Kept out of the bind mount: the host has no Node, and sharp's binaries
      # are built for this image rather than for your machine.
      - node_modules:/app/node_modules

volumes:
  node_modules:
